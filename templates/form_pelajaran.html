{% extends "base.html" %}
{% block title %}Form Pelajaran{% endblock %}
{% block content %}
<h1 class="page-title">{% if row.id %}Ubah Pembelajaran{% else %}Tambah Pembelajaran{% endif %}</h1>
<div class="card">
  <form method="post">
    <div class="form-grid">
      <div>
        <label>Kelas</label>
        <select name="kelas_id" required>
          {% for k in kelas %}<option value="{{ k.id }}" {% if row.kelas_id==k.id %}selected{% endif %}>{{ k.nama }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>Mata pelajaran</label>
        <select name="mapel_id" required>
          {% for m in mapel %}<option value="{{ m.id }}" {% if row.mapel_id==m.id %}selected{% endif %}>{{ m.nama }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>Guru</label>
        <select name="guru_id" required>
          {% for g in guru %}<option value="{{ g.id }}" {% if row.guru_id==g.id %}selected{% endif %}>{{ g.nama }}</option>{% endfor %}
        </select>
      </div>
      <div><label>Jam per minggu</label><input type="number" name="jam_per_minggu" value="{{ row.jam_per_minggu or 2 }}"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary">Simpan</button>
      <a class="btn btn-ghost" href="{{ url_for('main.data_pelajaran') }}">Batal</a>
    </div>
  </form>
</div>
{% endblock %}
