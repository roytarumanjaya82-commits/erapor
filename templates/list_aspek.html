{% extends "base.html" %}
{% block title %}Aspek Tahfiz{% endblock %}
{% block content %}
<h1 class="page-title">Aspek / Mapel Tahfiz</h1>
<div class="card">
  <form method="post" class="form-grid" style="margin-bottom:18px">
    <div><label>Nama aspek</label><input type="text" name="nama" required></div>
    <div><label>Jenis</label><input type="text" name="jenis" value="Hafalan"></div>
    <div><label>KKM</label><input type="number" name="kkm" value="75"></div>
    <div style="display:flex;align-items:end"><button class="btn btn-primary">Tambah</button></div>
  </form>
  <table class="data">
    <thead><tr><th>Nama</th><th>Jenis</th><th>KKM</th><th></th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr>
        <td>{{ r.nama }}</td><td>{{ r.jenis }}</td><td>{{ r.kkm }}</td>
        <td>
          <form method="post" action="{{ url_for('main.hapus_aspek', item_id=r.id) }}" onsubmit="return confirm('Hapus?')">
            <button class="btn btn-danger btn-sm">Hapus</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
