{% extends "base.html" %}
{% block title %}Ekstrakurikuler{% endblock %}
{% block content %}
<h1 class="page-title">Data Ekstra Kurikuler</h1>
<div class="card">
  <form method="post" class="form-grid" style="margin-bottom:18px">
    <div><label>Nama</label><input type="text" name="nama" required></div>
    <div>
      <label>Pembina</label>
      <select name="pembina_id">
        <option value="">-</option>
        {% for g in guru %}<option value="{{ g.id }}">{{ g.nama }}</option>{% endfor %}
      </select>
    </div>
    <div style="display:flex;align-items:end"><button class="btn btn-primary">Tambah</button></div>
  </form>
  <table class="data">
    <thead><tr><th>Nama</th><th>Pembina</th><th></th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr>
        <td>{{ r.nama }}</td><td>{{ r.pembina or '-' }}</td>
        <td>
          <form method="post" action="{{ url_for('main.hapus_ekskul', item_id=r.id) }}" onsubmit="return confirm('Hapus?')">
            <button class="btn btn-danger btn-sm">Hapus</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
