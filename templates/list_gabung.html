{% extends "base.html" %}
{% block title %}Gabung Mapel{% endblock %}
{% block content %}
<h1 class="page-title">Gabung Mapel</h1>
<div class="card">
  <form method="post" style="margin-bottom:18px">
    <div class="form-grid">
      <div class="full"><label>Nama gabungan</label><input type="text" name="nama_gabungan" required></div>
      <div class="full">
        <label>Pilih mapel</label>
        {% for m in mapel %}
        <label class="check"><input type="checkbox" name="mapel_id" value="{{ m.id }}"> {{ m.nama }}</label>
        {% endfor %}
      </div>
    </div>
    <div class="form-actions"><button class="btn btn-primary">Simpan gabungan</button></div>
  </form>
  <table class="data">
    <thead><tr><th>Nama gabungan</th><th>Mapel</th><th></th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr>
        <td>{{ r.nama_gabungan }}</td><td>{{ r.items }}</td>
        <td>
          <form method="post" action="{{ url_for('main.hapus_gabung', item_id=r.id) }}" onsubmit="return confirm('Hapus?')">
            <button class="btn btn-danger btn-sm">Hapus</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
