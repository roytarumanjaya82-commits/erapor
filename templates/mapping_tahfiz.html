{% extends "base.html" %}
{% block title %}Mapping Guru Tahfiz{% endblock %}
{% block content %}
<h1 class="page-title">Mapping Guru Tahfiz</h1>
<div class="card">
  <form method="post" class="form-grid" style="margin-bottom:18px">
    <div>
      <label>Guru</label>
      <select name="guru_id">{% for g in guru %}<option value="{{ g.id }}">{{ g.nama }}</option>{% endfor %}</select>
    </div>
    <div>
      <label>Kelas</label>
      <select name="kelas_id">{% for k in kelas %}<option value="{{ k.id }}">{{ k.nama }}</option>{% endfor %}</select>
    </div>
    <div>
      <label>Aspek</label>
      <select name="aspek_id">{% for a in aspek %}<option value="{{ a.id }}">{{ a.nama }}</option>{% endfor %}</select>
    </div>
    <div style="display:flex;align-items:end"><button class="btn btn-primary">Tambah</button></div>
  </form>
  <table class="data">
    <thead><tr><th>Guru</th><th>Kelas</th><th>Aspek</th><th></th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr>
        <td>{{ r.guru_nama }}</td><td>{{ r.kelas_nama }}</td><td>{{ r.aspek_nama }}</td>
        <td>
          <form method="post" action="{{ url_for('main.hapus_mapping_tahfiz', item_id=r.id) }}" onsubmit="return confirm('Hapus?')">
            <button class="btn btn-danger btn-sm">Hapus</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
