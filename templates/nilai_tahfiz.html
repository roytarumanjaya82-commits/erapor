{% extends "base.html" %}
{% block title %}Input Nilai Tahfiz{% endblock %}
{% block content %}
<h1 class="page-title">Input Nilai Tahfiz</h1>
<div class="card">
  <form method="get" class="toolbar">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select name="kelas_id" class="search">
        <option value="">Pilih kelas</option>
        {% for k in kelas %}<option value="{{ k.id }}" {% if kelas_id|string==k.id|string %}selected{% endif %}>{{ k.nama }}</option>{% endfor %}
      </select>
      <select name="aspek_id" class="search">
        <option value="">Pilih aspek</option>
        {% for a in aspek %}<option value="{{ a.id }}" {% if aspek_id|string==a.id|string %}selected{% endif %}>{{ a.nama }}</option>{% endfor %}
      </select>
      <button class="btn btn-ghost">Tampilkan</button>
    </div>
  </form>
  {% if siswa %}
  <form method="post" action="{{ url_for('main.simpan_nilai_tahfiz') }}">
    <input type="hidden" name="kelas_id" value="{{ kelas_id }}">
    <input type="hidden" name="aspek_id" value="{{ aspek_id }}">
    <table class="data">
      <thead><tr><th>NIS</th><th>Nama</th><th>Nilai</th><th>Predikat</th><th>Deskripsi</th></tr></thead>
      <tbody>
      {% for s in siswa %}
        <tr>
          <td>{{ s.nis }}<input type="hidden" name="siswa_id" value="{{ s.id }}"></td>
          <td>{{ s.nama }}</td>
          <td><input type="number" step="0.01" name="nilai_{{ s.id }}" value="{{ s.nilai or '' }}" style="max-width:90px"></td>
          <td><input type="text" name="predikat_{{ s.id }}" value="{{ s.predikat or '' }}" style="max-width:80px"></td>
          <td><input type="text" name="deskripsi_{{ s.id }}" value="{{ s.deskripsi or '' }}"></td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
    <div class="form-actions"><button class="btn btn-primary">Simpan nilai</button></div>
  </form>
  {% endif %}
</div>
{% endblock %}
